<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joga Books</title>
<meta name="theme-color" content="#b8924a">
<link rel="manifest" href="./assets/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="stylesheet" href="./assets/styles.css">
<style>
  /* v26: landing profesional mejorada — hero mas impactante, mejor jerarquia, mas breathing room / v26: improved professional landing — more impactful hero, better hierarchy, more breathing room */
  .hero-section { text-align: center; padding: 48px 0 32px; max-width: 640px; margin: 0 auto; }
  .badge { display: inline-block; border: 1px solid var(--accent); border-radius: 999px; padding: 10px 20px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: var(--accent-text); text-transform: uppercase; background: var(--accent-soft); margin-bottom: 24px; }
  .logo-hero { display: block; width: 280px; max-width: 100%; height: auto; margin: 0 auto 24px; mix-blend-mode: multiply; }
  .hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 900; line-height: 1.05; letter-spacing: -1px; margin-bottom: 20px; }
  @media (max-width: 480px) { .hero-title { font-size: 42px; } }
  .hero-subtitle { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 520px; margin: 0 auto; }

  .hero-photo-frame { max-width: 340px; margin: 32px auto 8px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 803 / 1440; }
  .hero-photo-frame video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .hero-quote { max-width: 420px; margin: 18px auto 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 17px; line-height: 1.5; color: var(--accent-text); }

  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 40px 0; }
  .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; text-align: center; transition: all 0.2s; box-shadow: var(--shadow); }
  .feature-card:hover { transform: translateY(-2px); box-shadow: 0 32px 80px rgba(31,25,22,.12); border-color: var(--accent); }
  .icon-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 24px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(184,146,74,.25); }
  .icon-poster, .icon-clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 18px; transition: opacity .3s; }
  .icon-clip { opacity: 0; mix-blend-mode: multiply; }
  .icon-clip.is-playing { opacity: 1; }
  .icon-poster.is-hidden { opacity: 0; }
  .feature-title { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
  .feature-desc { font-size: 15px; line-height: 1.6; color: var(--muted); }
  
  .cta-section { background: linear-gradient(135deg, var(--surface-2), #fff); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; text-align: center; margin: 48px 0; box-shadow: var(--shadow); }
  .cta-title { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; margin-bottom: 12px; }
  .cta-desc { font-size: 16px; color: var(--muted); margin-bottom: 28px; }
  .input-wrapper { max-width: 400px; margin: 0 auto; }
  .input { width: 100%; padding: 16px 20px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; background: white; transition: all 0.2s; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .error-text { color: var(--color-error); font-size: 14px; margin-top: 10px; display: none; font-weight: 500; }
  .btn { display: block; width: 100%; padding: 16px 24px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-text)); color: white; margin-top: 14px; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(184,146,74,.3); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .social-proof { text-align: center; margin: 48px 0 24px; padding: 32px 20px; }
  .social-proof-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent-text); margin-bottom: 20px; }
  .stats { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-number { font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 900; color: var(--accent-text); display: block; }
  .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  
  .footer { text-align: center; padding: 32px 20px; border-top: 1px solid var(--border); margin-top: 48px; }
  .footer-text { font-size: 14px; color: var(--muted); }
  .footer-link { color: var(--accent-text); text-decoration: none; font-weight: 600; }
  .footer-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="header">
  <div class="logo"><img src="./assets/logo-mark.png" alt="" width="41" height="26"> Joga Books</div>
  <div class="lang-switch">
    <button class="lang-btn" id="langEs" aria-label="Cambiar a español / Switch to Spanish">ES</button>
    <button class="lang-btn" id="langEn" aria-label="Cambiar a inglés / Switch to English">EN</button>
  </div>
</header>

    <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
    <div class="hero-photo-frame">
      <video controls playsinline preload="metadata" poster="./assets/images/hero-lectora.jpg" width="803" height="1440">
        <source src="./assets/videos/hero-lectora.mp4" type="video/mp4">
      </video>
    </div>
    <p class="hero-quote" data-i18n="hero.quote"></p>

        <div style="font-size:48px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:var(--accent-text);line-height:1;" data-i18n="pricing.price2"></div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px;" data-i18n="pricing.sub2"></div>
      </div>
    </div>

var codeInput = document.getElementById("accessCode");
var errEl = document.getElementById("accessError");
var btn = document.getElementById("enterBtn");

function showError(msg) { errEl.textContent = msg; errEl.style.display = "block"; }
function hideError() { errEl.style.display = "none"; }

async function tryEnter() {
  hideError();
  var code = codeInput.value.trim();
  var table = t.table();
  if (!code) { showError(table.access.empty); return; }
  btn.disabled = true;
  try {
    var ok = await window.jogaBooksGate.validate(code);
    if (ok) {
      localStorage.setItem("jogaBooks_licensed", "true");
      location.href = "./app.html";
    } else {
      showError(table.access.invalid);
    }
  } catch (e) {
    showError(table.access.invalid);
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", tryEnter);
codeInput.addEventListener("keydown", function (e) { if (e.key === "Enter") tryEnter(); });

function startIcon(clip) {
  var poster = clip.previousElementSibling;
  function ready() {
    if (clip.classList.contains("is-playing")) return;
    var p = clip.play();
    if (p && p.then) p.then(function () { clip.classList.add("is-playing"); poster.classList.add("is-hidden"); }).catch(function () {});
  }
  clip.addEventListener("canplay", ready);
  clip.addEventListener("loadeddata", ready);
  if (clip.readyState >= 3) ready();
  clip.addEventListener("ended", function () {
    clip.currentTime = 0;
    if (clip.readyState >= 3) clip.play().catch(function () {});
    else clip.addEventListener("canplay", function () { clip.play().catch(function () {}); }, { once: true });
  });
}
document.querySelectorAll(".icon-clip").forEach(startIcon);

if ("serviceWorker" in navigator) {
